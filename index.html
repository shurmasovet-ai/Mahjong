<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <title>Примерочная Маджонга</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: sans-serif; 
            background: radial-gradient(circle at center, #1e3c72, #0a1931);
            height: 100vh; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 40px; /* Расстояние между фишками */
        }

        h2 { color: white; text-align: center; margin-bottom: 20px; font-size: 1.2rem; }

        /* Общий стиль для всех демо-фишек */
        .demo-tile {
            width: 120px; height: 160px;
            font-size: 60px;
            display: flex; justify-content: center; align-items: center;
            border-radius: 12px;
            border-top: 2px solid #ffffff; border-left: 2px solid #ffffff;
        }

        /* ВАРИАНТ 1: Теплая кость (Побег папайи) */
        .bone {
            background-color: #ffefd5; color: #1a2a3a;
            border-right: 8px solid #dcb26b; border-bottom: 12px solid #c29b4f;
            box-shadow: 6px 6px 15px rgba(0,0,0,0.7);
        }

        /* ВАРИАНТ 2: Холодная керамика (Дымчатый) */
        .ceramic {
            background-color: #f8f9fa; color: #1a2a3a;
            border-right: 8px solid #ced4da; border-bottom: 12px solid #adb5bd;
            box-shadow: 6px 6px 15px rgba(0,0,0,0.7);
        }

        /* ВАРИАНТ 3: Дерево/Бамбук (Экрю) */
        .wood {
            background-color: #d2b48c; color: #1a2a3a;
            border-right: 8px solid #a0522d; border-bottom: 12px solid #8b4513;
            box-shadow: 6px 6px 15px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>

    <div>
        <h2>1. Теплая кость</h2>
        <div class="demo-tile bone">🌸</div>
    </div>

    <div>
        <h2>2. Белая керамика</h2>
        <div class="demo-tile ceramic">🐉</div>
    </div>

    <div>
        <h2>3. Дерево (Бамбук)</h2>
        <div class="demo-tile wood">🎋</div>
    </div>

</body>
</html>
