<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light only">
    <title>Mahjong Deluxe - Infinity 8888</title>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
    <style>
        :root { 
            color-scheme: light; 
            /* Дефолтные переменные (Классическое печенье) */
            --bg1: #1b5e20; --bg2: #0a2e0c;
            --tileBg: #fffaf0; --tileBorder: #fdf5e6;
            --tileColor: #1a2a3a;
            --bgImg: radial-gradient(#e6d5b8 15%, transparent 16%), radial-gradient(#e6d5b8 15%, transparent 16%);
            --shadow: 0 5px 10px rgba(0,0,0,0.6), inset 0 0 12px rgba(180, 140, 100, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: sans-serif; 
            background: radial-gradient(circle at center, var(--bg1), var(--bg2));
            color: white; width: 100vw; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: background 1.5s ease;
        }

        #main-menu {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; width: 100%; position: absolute; top: 0; left: 0; z-index: 50;
        }
        
        #main-menu h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 14vw; margin-bottom: 15px; color: #f1c40f; 
            text-align: center; letter-spacing: 2px;
            text-shadow: 0 6px 0 #b7950b, 0 10px 20px rgba(0,0,0,0.8);
        }
        
        #menu-level-text { font-size: 6vw; font-weight: bold; color: #2ecc71; margin-bottom: 40px; }

        .btn {
            background-color: #f1c40f; color: #7d6608; border: none; padding: 15px 40px;
            font-family: 'Russo One', sans-serif; font-size: 6vw; border-radius: 30px; 
            box-shadow: 0 6px 0 #b7950b, 0 10px 15px rgba(0,0,0,0.5); cursor: pointer; 
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation; user-select: none; margin-bottom: 20px; width: 70vw; max-width: 300px;
            display: flex; justify-content: center; align-items: center; letter-spacing: 1px;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #b7950b; }
        .btn-secondary { background-color: #3498db; color: white; box-shadow: 0 6px 0 #2980b9; }
        .btn-secondary:active { box-shadow: 0 0 0 #2980b9; }
        .btn-small {
            font-family: sans-serif; font-size: 4vw; padding: 10px 15px; border-radius: 15px;
            box-shadow: 0 4px 0 #b7950b; width: auto; margin-bottom: 0; font-weight: bold;
        }
        .btn-small:active { transform: translateY(4px); box-shadow: 0 0 0 #b7950b; }

        #rules-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.95); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }
        #rules-modal h2 { font-family: 'Russo One', sans-serif; font-size: 8vw; color: #f1c40f; margin-bottom: 20px; }
        #rules-modal p { font-size: 5vw; line-height: 1.5; margin-bottom: 30px; max-width: 400px; }

        #game-screen {
            display: none; flex-direction: column; align-items: center;
            width: 100%; height: 100%; padding-top: 20px; z-index: 10;
        }
        #top-bar {
            width: 90vw; max-width: 400px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 5vw;
        }
        
        /* Сделали индикатор уровня кликабельным (кнопка разработчика) */
        #hud-level { 
            font-family: 'Russo One', sans-serif; font-size: 5vw; color: #f1c40f; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); cursor: pointer; padding: 5px 15px;
        }
        #hud-level:active { transform: scale(0.9); }

        #game-board {
            width: 90vw; height: 112.5vw; max-width: 400px; max-height: 500px; 
            position: relative; margin-top: 5vw; 
        }
        
        /* Плитки 2:3 с динамическими материалами */
        .tile {
            position: absolute; 
            width: 20%; height: 24%;
            left: calc(var(--x) * 10% + 10%); top: calc(var(--y) * 12% + 2%);
            margin-top: calc(var(--z) * -3.5vw); margin-left: calc(var(--z) * -2vw);
            
            background-color: var(--tileBg); 
            background-image: var(--bgImg);
            background-size: 14px 14px; background-position: 0 0, 7px 7px;

            color: var(--tileColor); font-size: 8.5vw; 
            display: flex; justify-content: center; align-items: center;
            
            border-radius: 12px; border: 2px solid var(--tileBorder);
            
            box-shadow: var(--shadow), calc(1vw + var(--z) * 0.5vw) calc(1.5vw + var(--z) * 0.5vw) calc(2vw + var(--z) * 0.8vw) rgba(0,0,0,0.85);
            backdrop-filter: blur(4px); 
            
            touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s, filter 0.2s, box-shadow 0.2s; cursor: pointer;
        }
        
        @media (min-width: 400px) {
            .tile { font-size: 32px; border-radius: 14px; } 
            #main-menu h1 { font-size: 52px; }
            .btn { font-size: 24px; } .btn-small { font-size: 16px; }
            .tile { margin-top: calc(var(--z) * -14px); margin-left: calc(var(--z) * -8px); }
        }

        .tile.blocked { filter: brightness(0.5); cursor: not-allowed; }
        .tile.selected { 
            border-color: #f1c40f !important;
            box-shadow: 0 0 20px #f1c40f, 0 10px 20px rgba(0,0,0,0.9) !important;
            transform: translateY(-3vw) scale(1.08); z-index: 999 !important;
        }
        .tile.matched { opacity: 0; pointer-events: none; transform: scale(1.4); }

        #message { font-family: 'Russo One', sans-serif; font-size: 6vw; max-font-size: 24px; height: 65px; color: #2ecc71; text-align: center; margin-top: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        #ad-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.95); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center;
        }
        #ad-screen h2 { font-family: 'Russo One', sans-serif; font-size: 8vw; color: #f1c40f; margin-bottom: 20px; }
        #ad-screen p { font-size: 5vw; }
        .loader {
            border: 6px solid #f3f3f3; border-top: 6px solid #e67e22;
            border-radius: 50%; width: 50px; height: 50px;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>МАДЖОНГ</h1>
        <div id="menu-level-text">Уровень 1</div>
        <button id="btn-play" class="btn">▶ ИГРАТЬ</button>
        <button id="btn-rules" class="btn btn-secondary">📖 ПРАВИЛА</button>
    </div>

    <div id="rules-modal">
        <h2>Как играть?</h2>
        <p>Находите пары одинаковых фишек, чтобы очистить поле.</p>
        <p>Фишка активна, если на ней <b>ничего не лежит</b>, и она <b>свободна слева ИЛИ справа</b>.</p>
        <button id="btn-close-rules" class="btn">ПОНЯТНО</button>
    </div>

    <div id="game-screen">
        <div id="top-bar">
            <button id="btn-menu" class="btn btn-small btn-secondary">🏠 Меню</button>
            <!-- ЭТО ВАША СЕКРЕТНАЯ КНОПКА -->
            <div id="hud-level" title="Нажмите для пропуска уровня">Ур. 1</div>
            <button id="btn-shuffle" class="btn btn-small">🎥 Микс</button>
        </div>
        <div id="game-board"></div>
        <div id="message"></div>
    </div>

    <div id="ad-screen">
        <div class="loader"></div>
        <h2>Рекламная пауза</h2>

    </div>

            },
            { // 11. Аметист
                bg1: '#1a0033', bg2: '#05001a', tileBg: '#4a148c', tileBorder: '#6a1b9a', tileColor: '#f3e5f5',
                bgImg: 'linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%, rgba(0,0,0,0.2) 100%)',
                shadow: '0 5px 15px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 0, 0, 0.5), 0 0 10px rgba(142, 36, 170, 0.4)'
            },
            { // 12. Стекло
                bg1: '#e0f7fa', bg2: '#80deea', tileBg: 'rgba(255, 255, 255, 0.4)', tileBorder: 'rgba(255, 255, 255, 0.8)', tileColor: '#006064',
                bgImg: 'linear-gradient(135deg, rgba(255,255,255,0.6) 0%, transparent 100%)',
                shadow: '0 5px 15px rgba(0,0,0,0.2), inset 0 0 20px rgba(255,255,255,0.5)'
            }
        ];

        let activeTiles = [], firstTile = null, secondTile = null;

        document.getElementById('menu-level-text').innerText = 'Уровень ' + currentLevel;
        document.getElementById('hud-level').innerText = 'Ур. ' + currentLevel;

        document.getElementById('btn-play').addEventListener('click', () => { 
            document.getElementById('main-menu').style.display = 'none'; 
            document.getElementById('game-screen').style.display = 'flex'; 
            initGame(); 
        });
        document.getElementById('btn-rules').addEventListener('click', () => document.getElementById('rules-modal').style.display = 'flex');
        document.getElementById('btn-close-rules').addEventListener('click', () => document.getElementById('rules-modal').style.display = 'none');
        document.getElementById('btn-menu').addEventListener('click', () => { 
            document.getElementById('game-screen').style.display = 'none'; 
            document.getElementById('main-menu').style.display = 'flex'; 
        });
        document.getElementById('btn-shuffle').addEventListener('click', watchAdToShuffle);

        // --- СЕКРЕТНАЯ КНОПКА РАЗРАБОТЧИКА ---
        document.getElementById('hud-level').addEventListener('click', () => {
            currentLevel++;
            localStorage.setItem('mahjong_level', currentLevel);
            document.getElementById('hud-level').innerText = 'Ур. ' + currentLevel;
            document.getElementById('menu-level-text').innerText = 'Уровень ' + currentLevel;
            initGame();
        });
        // ------------------------------------

        function applyMaterial(level) {
            let root = document.documentElement;
            let matIndex = Math.floor((level - 1) / 3) % materials.length; 
            let mat = materials[matIndex];
            root.style.setProperty('--bg1', mat.bg1);
            root.style.setProperty('--bg2', mat.bg2);
            root.style.setProperty('--tileBg', mat.tileBg);
            root.style.setProperty('--tileBorder', mat.tileBorder);
            root.style.setProperty('--tileColor', mat.tileColor);
            root.style.setProperty('--bgImg', mat.bgImg);
            root.style.setProperty('--shadow', mat.shadow);
        }

        function generateLayout(level) {
            if (level === 1) return [
                {x:0, y:0, z:0}, {x:2, y:0, z:0}, {x:4, y:0, z:0}, {x:6, y:0, z:0}, 
                {x:0, y:2, z:0}, {x:2, y:2, z:0}, {x:4, y:2, z:0}, {x:6, y:2, z:0}, 
                {x:0, y:4, z:0}, {x:2, y:4, z:0}, {x:4, y:4, z:0}, {x:6, y:4, z:0}, 
                {x:0, y:6, z:0}, {x:2, y:6, z:0}, {x:4, y:6, z:0}, {x:6, y:6, z:0}, 
                {x:1, y:1, z:1}, {x:3, y:1, z:1}, {x:5, y:1, z:1}, 
                {x:1, y:3, z:1}, {x:3, y:3, z:1}, {x:5, y:3, z:1}, 
                {x:1, y:5, z:1}, {x:3, y:5, z:1}, {x:5, y:5, z:1}, 
                {x:2, y:2, z:2}, {x:4, y:2, z:2}, 
                {x:2, y:4, z:2}, {x:4, y:4, z:2}, 
                {x:3, y:3, z:3}
            ];
            
            let layout = [], grid = {};
            let seed = level * 13371337;
            function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

            let maxCols = 8, maxRows = 8;
            let maxLayers = Math.min(2 + Math.floor(level / 10), 5); 
            let density = 0.7 + (rnd() * 0.2); 
            
            for (let z = 0; z < maxLayers; z++) {
                let shrink = z; 
                for (let y = shrink; y <= maxRows - shrink - 2; y += 2) {
                    for (let x = shrink; x <= maxCols - shrink - 2; x += 2) {
                        let isSupported = false;
                        if (z === 0) isSupported = true;
                        else {
                            isSupported = grid[`${x},${y},${z-1}`] || grid[`${x-1},${y},${z-1}`];
                        }
                        if (isSupported && rnd() < density) {
                            layout.push({x: x, y: y, z: z}); 
                            grid[`${x},${y},${z}`] = true;
                        }
                    }
                }
            }
            if (layout.length % 2 !== 0) layout.pop(); 
            if (layout.length < 4) return [{x: 2, y: 2, z: 0}, {x: 4, y: 2, z: 0}, {x: 2, y: 4, z: 0}, {x: 4, y: 4, z: 0}];
            return layout;
        }

        function getSymbolsForLevel(level) {
            if (level <= 50) {
                let themeIndex = (level - 1) % themeSets.length;
                return themeSets[themeIndex];
            } else {
                let mixedSymbols = [];
                let t1 = Math.floor(Math.random() * themeSets.length);
                let t2 = Math.floor(Math.random() * themeSets.length);
                let t3 = Math.floor(Math.random() * themeSets.length);
                mixedSymbols = [...themeSets[t1].slice(0, 7), ...themeSets[t2].slice(7, 14), ...themeSets[t3].slice(14, 20)];
                return mixedSymbols;
            }
        }

        function initGame() {
            const board = document.getElementById('game-board'); 
            board.innerHTML = ''; activeTiles = []; firstTile = null; secondTile = null;
            document.getElementById('message').innerHTML = '';
            
            applyMaterial(currentLevel); 
            
            let baseSymbols = getSymbolsForLevel(currentLevel);
            let layout = generateLayout(currentLevel);
            let symbols = []; 
            
            for(let i = 0; i < layout.length / 2; i++) {
                symbols.push(baseSymbols[Math.floor(Math.random() * baseSymbols.length)]);
            }
            symbols = [...symbols, ...symbols]; shuffleArray(symbols);
            
            layout.forEach((pos, i) => {
                const el = document.createElement('div'); el.classList.add('tile'); el.innerText = symbols[i];
                el.style.setProperty('--x', pos.x); el.style.setProperty('--y', pos.y); el.style.setProperty('--z', pos.z); 
                el.style.zIndex = (pos.z * 100) + pos.y;
                let obj = { el, symbol: symbols[i], x: pos.x, y: pos.y, z: pos.z, isFree: false };
                el.addEventListener('click', () => handleTileClick(obj));
                board.appendChild(el); activeTiles.push(obj);
            });
            updateFreeState();
        }

        function shuffleArray(a) { 
            for (let i = a.length - 1; i > 0; i--) { 
                const j = Math.floor(Math.random() * (i + 1)); 
                [a[i], a[j]] = [a[j], a[i]]; 
            } 
        }

        function updateFreeState() {
            activeTiles.forEach(tile => {
                let blockedTop = false, blockedLeft = false, blockedRight = false;
                for (let other of activeTiles) {
                    if (other === tile) continue;
                    let overlapX = Math.abs(tile.x - other.x) < 2;
                    let overlapY = Math.abs(tile.y - other.y) < 2;

                    if (other.z > tile.z && overlapX && overlapY) blockedTop = true;
                    if (other.z === tile.z && overlapY) {
                        if (other.x === tile.x - 2) blockedLeft = true;
                        if (other.x === tile.x + 2) blockedRight = true;
                    }
                }
                tile.isFree = !blockedTop && (!blockedLeft || !blockedRight);
                tile.el.classList.toggle('blocked', !tile.isFree);
            });
            checkGameState();
        }

        function checkGameState() {
            if (activeTiles.length === 0) return;
            let freeTiles = activeTiles.filter(t => t.isFree);
            let symbolsSet = new Set();
            let hasMoves = false;
            for (let t of freeTiles) {
                if (symbolsSet.has(t.symbol)) { hasMoves = true; break; }
                symbolsSet.add(t.symbol);
            }
            if (!hasMoves) {
                document.getElementById('message').innerText = 'Нет ходов! Нажмите "Микс"';
                document.getElementById('message').style.color = '#e74c3c';
            } else {
                document.getElementById('message').innerHTML = '';
            }
        }

        function handleTileClick(t) { 
            if (!t.isFree) return;
            
            if (!firstTile) { 
                t.el.classList.add('selected'); 
                firstTile = t; 
            } else if (firstTile !== t) { 
                t.el.classList.add('selected'); 
                if (firstTile.symbol === t.symbol) { 
                    activeTiles = activeTiles.filter(x => x !== firstTile && x !== t); 
                    t.el.classList.add('matched'); 
                    firstTile.el.classList.add('matched'); 
                    firstTile = null; 
                    updateFreeState();
                    
                    if (activeTiles.length === 0) {
                        currentLevel++;
                        localStorage.setItem('mahjong_level', currentLevel);
                        document.getElementById('hud-level').innerText = 'Ур. ' + currentLevel;
                        document.getElementById('menu-level-text').innerText = 'Уровень ' + currentLevel;
                        document.getElementById('message').innerHTML = '🎉 Уровень пройден!';
                        document.getElementById('message').style.color = '#2ecc71';
                        
                        setTimeout(() => {
                            initGame();
                        }, 1500);
                    }
                } else { 
                    let t1 = firstTile, t2 = t;
                    firstTile = null;
                    setTimeout(() => { 
                        t1.el.classList.remove('selected'); 
                        t2.el.classList.remove('selected'); 
                    }, 300); 
                } 
            } else {
                t.el.classList.remove('selected');
                firstTile = null;
            }
        }

        function watchAdToShuffle() { 
            if (activeTiles.length === 0) return;
            const ad = document.getElementById('ad-screen'); 
            ad.style.display = 'flex'; 
            
            setTimeout(() => { 
                ad.style.display = 'none'; 
                let currentSymbols = activeTiles.map(t => t.symbol);
                shuffleArray(currentSymbols);
                activeTiles.forEach((tile, index) => {
                    tile.symbol = currentSymbols[index];
                    tile.el.innerText = tile.symbol;
                    tile.el.classList.remove('selected');
                });
                firstTile = null;
                updateFreeState();
                document.getElementById('message').innerText = 'Перемешано! ✨';
                document.getElementById('message').style.color = '#f1c40f';
            }, 2000); 
        }
    </script>
</body>
